name: transcribe_cpp
description: "Offline, on-device speech-to-text for Flutter. Hands-free dictation with live text on iOS and Android: no network, no API keys, audio never leaves the phone."
version: 0.1.1
homepage: https://github.com/ishangavidusha/transcribe_cpp
repository: https://github.com/ishangavidusha/transcribe_cpp
issue_tracker: https://github.com/ishangavidusha/transcribe_cpp/issues
documentation: https://ishangavidusha.github.io/transcribe_cpp/

topics:
  - speech-to-text
  - speech-recognition
  - transcription
  - offline
  - ffi

screenshots:
  - description: Live transcription running on the phone, with the sentence in progress in grey.
    path: screenshots/demo.gif

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  crypto: ^3.0.7

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  #
  # Please refer to README.md for a detailed explanation.
  plugin:
    platforms:
      ios:
        # Both: the engine, VAD and ring are reached over FFI, but microphone
        # capture needs AVAudioSession, so there is a registered plugin class
        # carrying control and state. Audio itself never crosses the channel.
        ffiPlugin: true
        pluginClass: TranscribeCppPlugin
        sharedDarwinSource: false
      android:
        # Same split as iOS. ffiPlugin builds src/ into libtranscribe_cpp.so;
        # the engine ships prebuilt beside it (tool/build_android.sh).
        ffiPlugin: true
        package: com.transcribecpp.transcribe_cpp
        pluginClass: TranscribeCppPlugin

  # Silero VAD weights (~1.2 MB), extracted from the official ONNX by
  # tool/extract_silero_weights.py. Shipped with the package so apps get
  # endpointing without sourcing a second artifact; read via
  # SileroVad.loadBundledWeights(), which knows the packages/ prefix Flutter
  # requires for assets that live in a dependency.
  assets:
    - assets/silero_vad.bin

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
